version: 2
updates:

  # Couchster project dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 10
    groups:
      node:
        patterns:
          - '*'
    versioning-strategy: increase

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 10
    groups:
      github-actions:
        patterns:
          - '*'
